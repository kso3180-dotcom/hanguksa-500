<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한능검 심화 기출 500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 수험장처럼 차분하고 단호하게, 칭찬은 짧고 따뜻하게
   IDEA: 한능검 OMR 답안지 — 문제는 시험지 한 장, 답은 마킹 칸
   PICTURE: 문항 이미지(시험지)와 그 아래 ①~⑤ 마킹 줄이 화면의 주인공
   COLOUR+TYPE: 흰 종이 + 쪽빛 지배색 + 단청 주홍 강조 / Gowun Batang 제목 + IBM Plex Sans KR 본문
   LAYOUT: 한 열, 폰 우선. 위 상태줄 · 가운데 시험지 · 아래 고정 마킹 줄 */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#0e1324);--paper:light-dark(#ffffff,#161c33);--ink:light-dark(#151a2d,#e8ebf6);
 --mute:light-dark(#5d6378,#a3aac2);--line:light-dark(#d9dceb,#2b3352);
 --indigo:light-dark(#1f3a8a,#8fa8ff);--indigo-bg:light-dark(#1f3a8a,#1b2756);--on-indigo:#ffffff;
 --tint:light-dark(#eef1fb,#1a2244);--red:light-dark(#d1402a,#ff7b66);--red-tint:light-dark(#fdeceb,#3a1c1c);
 --ok:light-dark(#1f3a8a,#8fa8ff);--gold:#f2b632}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Gowun Batang",serif;line-height:1.15;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,16px)}
.hide{display:none!important}
/* 표지 */
.cover{background:var(--indigo-bg);color:var(--on-indigo);padding:28px 0 26px}
.cover h1{font-size:clamp(32px,7vw,46px)}
.cover p{margin:8px 0 0;opacity:.85}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid currentColor;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px}
.cover .chip{border-color:rgba(255,255,255,.5)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.25);margin-top:18px;border-radius:10px;overflow:hidden}
.kpis div{background:var(--indigo-bg);padding:10px 12px}
.kpis b{display:block;font-size:24px;font-family:"Gowun Batang",serif}
.kpis span{font-size:13px;opacity:.85}
/* 섹션 */
.sec{padding:22px 0;border-bottom:1px solid var(--line)}
.sec h2{font-size:26px}
.sec .sub{color:var(--mute);font-size:14px;margin:4px 0 14px}
.rounds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rbtn{border:1.5px solid var(--indigo);border-radius:10px;padding:10px 4px;text-align:center;min-height:64px;color:var(--indigo);background:var(--paper)}
.rbtn b{display:block;font-size:20px;font-family:"Gowun Batang",serif}
.rbtn small{font-size:12px;color:var(--mute)}
.rbtn.done{background:var(--tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;min-height:44px;font-size:15px;background:var(--paper)}
.tog[aria-pressed=true]{border-color:var(--indigo);background:var(--indigo);color:var(--on-indigo)}
.tog small{opacity:.75;margin-left:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.lbl{font-size:14px;color:var(--mute);min-width:64px}
.go{background:var(--indigo);color:var(--on-indigo);border-radius:12px;padding:12px 22px;min-height:48px;font-weight:700;font-size:16px}
.go.ghost{background:transparent;color:var(--indigo);border:1.5px solid var(--indigo)}
.go.red{background:var(--red)}
.go:disabled{opacity:.4;cursor:default}
.note{font-size:14px;color:var(--mute);margin-top:10px}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist li b{white-space:nowrap}
/* 문제 화면 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.bar .t{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{min-width:44px;min-height:44px;border-radius:10px;font-size:15px;font-weight:600;color:var(--indigo);padding:0 8px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--indigo);white-space:nowrap}
.clock.warn{color:var(--red)}
.tline{height:4px;background:var(--tint)}
.tline i{display:block;height:100%;background:var(--indigo);transition:width 1s linear}
.tline i.warn{background:var(--red)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px;font-size:14px;color:var(--mute)}
.meta b{color:var(--ink);font-size:16px}
.tag{border-radius:6px;padding:2px 8px;background:var(--tint);color:var(--indigo);font-weight:600;font-size:13px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.sheet img{display:block;width:100%;height:auto;cursor:zoom-in}
.omr{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.marks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mk{height:56px;border:2px solid var(--red);border-radius:28px;color:var(--red);font-size:22px;font-weight:700;background:var(--paper);transition:transform .08s}
.mk:active{transform:scale(.95)}
.mk.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mk.right{background:var(--indigo);border-color:var(--indigo);color:#fff}
.mk.wrong{background:var(--red);border-color:var(--red);color:#fff}
.mk:disabled{cursor:default}
.nav{display:flex;gap:8px;margin-top:8px}
.nav .go{flex:1;padding:10px}
.fb{border-radius:12px;padding:14px 16px;margin:4px 0 14px;border:1.5px solid var(--indigo);background:var(--tint)}
.fb.bad{border-color:var(--red);background:var(--red-tint)}
.fb h3{font-size:22px}
.fb p{margin:6px 0 0}
.fb .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:15px}
/* 답안지(OMR 판) */
.ov{position:fixed;inset:0;z-index:20;background:rgba(8,12,28,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(4vw,16px) calc(18px + env(safe-area-inset-bottom))}
.panel h3{font-size:22px;margin-bottom:10px}
.grid50{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.cell{min-height:44px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;background:var(--paper)}
.cell em{font-style:normal;font-size:15px;color:var(--red)}
.cell.filled{border-color:var(--indigo)}
.cell.cur{outline:3px solid var(--gold)}
.cell.x{background:var(--red-tint);border-color:var(--red)}
.cell.o{background:var(--tint);border-color:var(--indigo)}
.zoom{position:fixed;inset:0;z-index:30;background:#fff;overflow:auto}
.zoom img{display:block;margin:0 auto}
.zoom .zb{position:fixed;top:10px;right:10px;display:flex;gap:6px}
.zoom .zb button{background:var(--indigo);color:#fff;border-radius:10px;min-width:44px;min-height:44px;font-weight:700}
/* 결과 */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-family:"Gowun Batang",serif;font-size:clamp(56px,14vw,84px);line-height:1;color:var(--indigo)}
.grade{font-size:20px;font-weight:700}
.grade.fail{color:var(--red)}
.erow{display:grid;grid-template-columns:7.5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.ebar{height:12px;background:var(--tint);border-radius:6px;overflow:hidden}
.ebar i{display:block;height:100%;background:var(--indigo)}
.erow span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.status{border-radius:10px;padding:10px 12px;background:var(--tint);font-size:14px;margin-top:12px}
.status.bad{background:var(--red-tint)}
textarea.code{width:100%;min-height:80px;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
.field{width:100%;max-width:340px;font-size:20px;padding:12px 14px;border:2px solid var(--indigo);border-radius:12px;background:var(--paper);letter-spacing:.08em}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.dlg p{margin:0 0 14px}
@media(max-width:600px){.rounds{grid-template-columns:repeat(5,minmax(0,1fr))}.grid50{grid-template-columns:repeat(5,minmax(0,1fr))}.erow{grid-template-columns:6.5em minmax(0,1fr) 4em}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"><div class="wrap" style="padding:40px 16px">불러오는 중…</div></main>
<div id="layer"></div>
<script>
{
const ERAS=["선사·여러 나라","삼국·남북국","고려","조선 전기","조선 후기","근대(개항기)","일제 강점기","현대","통합·주제"];
const MARK=["①","②","③","④","⑤"];
const $app=document.getElementById('app'),$layer=document.getElementById('layer');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('hk_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem('hk_'+k,JSON.stringify(v))}catch(e){}}};
let CFG={scriptUrl:'',examMinutes:80},Q=[],BY={};
let S=null; // 현재 풀이 세션
let tick=null;
const pick={eras:new Set(),count:10,sec:60,trange:'all'};

/* ---------- 데이터 ---------- */
async function boot(){
  try{const c=await fetch('config.json');if(c.ok)CFG={...CFG,...await c.json()}}catch(e){}
  try{const r=await fetch('data/questions.json');Q=await r.json()}catch(e){$app.innerHTML='<div class="wrap" style="padding:40px 16px">문항 데이터를 불러오지 못했어요. 새로고침해 주세요.</div>';return}
  Q.forEach(x=>BY[x.id]=x);
  flushOutbox();
  const resume=store.get('mock',null);
  if(!store.get('code',''))return showLogin();
  home(resume);
}
const code=()=>store.get('code','');
const wrongs=()=>store.get('wrong',{});
const stats=()=>store.get('stats',{});

/* ---------- 로그인(개인 코드) ---------- */
function showLogin(msg){
  $app.innerHTML=`<section class="cover login"><div class="wrap">
   <h1>한능검 심화<br>기출 500</h1><p>제71회~제80회 · 500문항 · 시대별·회차별</p>
   <form id="lf" style="margin-top:26px"><label for="ci" style="display:block;font-weight:600;margin-bottom:8px">선생님께 받은 개인 코드</label>
   <input id="ci" class="field" autocomplete="off" autocapitalize="characters" maxlength="20" placeholder="예: HK2031" value="${esc(code())}">
   <div class="row"><button class="go" style="background:#fff;color:#1f3a8a">시작하기</button></div>
   <p id="lm" class="note" style="color:#fff;opacity:.9">${esc(msg||(CFG.scriptUrl?'':'미리보기 모드: 아무 코드나 넣어도 돼요. 기록은 이 기기에만 저장됩니다.'))}</p></form></div></section>`;
  document.getElementById('lf').onsubmit=async e=>{
    e.preventDefault();
    const v=document.getElementById('ci').value.trim().toUpperCase();
    const lm=document.getElementById('lm');
    if(!/^[0-9A-Z가-힣_-]{2,20}$/.test(v)){lm.textContent='코드는 영문·숫자 2~20자로 넣어 주세요.';return}
    if(CFG.scriptUrl){
      lm.textContent='코드 확인 중…';
      try{const r=await fetch(CFG.scriptUrl+'?action=check&code='+encodeURIComponent(v));const j=await r.json();
        if(!j.ok){lm.textContent='등록되지 않은 코드예요. 선생님께 확인해 주세요.';return}}
      catch(err){lm.textContent='지금은 코드 확인이 안 돼요(인터넷 확인). 일단 시작하고, 결과는 나중에 자동 제출돼요.'}
    }
    store.set('code',v);home(store.get('mock',null));
  };
}

/* ---------- 홈 ---------- */
function home(resume){
  stopTick();S=null;
  const st=stats(),ids=Object.keys(st),tried=ids.length;
  const cor=ids.filter(k=>st[k].last===1).length;
  const w=Object.keys(wrongs()).length;
  const best=store.get('best',{});
  const hist=store.get('hist',[]).slice(0,8);
  const out=store.get('outbox',[]).length;
  const ec=ERAS.map((_,i)=>Q.filter(x=>x.e===i).length);
  $app.innerHTML=`
  <section class="cover"><div class="wrap">
    <h1>한능검 심화 기출 500</h1><p>제71회~제80회 기출 · 오늘도 한 문제씩, 합격까지!</p>
    <div class="who"><span class="chip">개인 코드 ${esc(code())}</span><button class="chip" id="chg" style="color:#fff">코드 바꾸기</button></div>
    <div class="kpis"><div><b>${tried}</b><span>푼 문항 / 500</span></div><div><b>${tried?Math.round(cor/tried*100):0}%</b><span>최근 정답률</span></div><div><b>${w}</b><span>오답노트</span></div></div>
  </div></section>
  <div class="wrap">
   ${resume?`<section class="sec"><h2>풀던 모의고사가 있어요</h2><p class="sub">제${resume.round}회 · ${Object.keys(resume.ans).length}/50 마킹 · 남은 시간 ${fmt(resume.left)}</p>
     <div class="row"><button class="go" id="resume">이어서 풀기</button><button class="go ghost" id="drop">버리기</button></div></section>`:''}
   <section class="sec"><h2>실전 모의고사</h2><p class="sub">50문항 · ${CFG.examMinutes}분 · 80점 이상 1급 / 70점 2급 / 60점 3급</p>
     <div class="rounds">${[71,72,73,74,75,76,77,78,79,80].map(r=>`<button class="rbtn ${best[r]!=null?'done':''}" data-r="${r}"><b>${r}</b><small>${best[r]!=null?'최고 '+best[r]+'점':'제'+r+'회'}</small></button>`).join('')}</div></section>
   <section class="sec"><h2>시대별 풀이</h2><p class="sub">시대를 골라서 · 풀자마자 정답과 해설 확인</p>
     <div class="chips" id="eras">${ERAS.map((n,i)=>`<button class="tog" data-e="${i}" aria-pressed="${pick.eras.has(i)}">${n}<small>${ec[i]}</small></button>`).join('')}</div>
     <div class="row"><span class="lbl">문항 수</span><div class="chips" id="cnt">${[10,20,0].map(c=>`<button class="tog" data-c="${c}" aria-pressed="${pick.count===c}">${c||'전체'}</button>`).join('')}</div></div>
     <div class="row"><button class="go" id="goEra" ${pick.eras.size?'':'disabled'}>시대별 풀기</button><span class="note" id="eraN"></span></div></section>
   <section class="sec"><h2>랜덤 10문제</h2><p class="sub">500문항 중 무작위 10문제 · 하루 한 세트 추천</p>
     <button class="go" id="goRnd">바로 풀기</button></section>
   <section class="sec"><h2>한 문제씩 타이머</h2><p class="sub">문제마다 제한 시간 · 시간이 지나면 오답 처리 후 다음 문제</p>
     <div class="row"><span class="lbl">제한 시간</span><div class="chips" id="sec">${[45,60,90].map(s=>`<button class="tog" data-s="${s}" aria-pressed="${pick.sec===s}">${s}초</button>`).join('')}</div></div>
     <div class="row"><span class="lbl">범위</span><div class="chips" id="tr"><button class="tog" data-t="all" aria-pressed="${pick.trange==='all'}">전체 랜덤</button><button class="tog" data-t="era" aria-pressed="${pick.trange==='era'}">위에서 고른 시대</button></div></div>
     <div class="row"><button class="go" id="goTim">타이머 시작 (10문제)</button></div></section>
   <section class="sec"><h2>오답노트</h2><p class="sub">${w?`틀린 문제 ${w}개 · 다시 맞히면 노트에서 빠져요`:'아직 틀린 문제가 없어요. 문제를 풀면 자동으로 모여요.'}</p>
     <div class="row"><button class="go" id="goWr" ${w?'':'disabled'}>오답 다시 풀기</button>${w?'<button class="go ghost" id="clrWr">비우기</button>':''}</div></section>
   <section class="sec"><h2>내 기록</h2><p class="sub">${CFG.scriptUrl?(out?`선생님께 아직 못 보낸 기록 ${out}건이 있어요.`:'기록은 선생님께 자동으로 제출돼요.'):'미리보기 모드라 기록은 이 기기에만 있어요.'}</p>
     ${out&&CFG.scriptUrl?'<button class="go ghost" id="resend">다시 보내기</button>':''}
     ${hist.length?`<ul class="hist">${hist.map(h=>`<li><span>${esc(h.label)}<br><small style="color:var(--mute)">${esc(h.at.slice(5,16).replace('T',' '))}</small></span><b>${h.mode==='mock'?esc(h.score)+'점':esc(h.correct)+'/'+esc(h.total)}</b></li>`).join('')}</ul>`:'<p class="note">아직 기록이 없어요.</p>'}
   </section>
   <p class="note" style="padding:18px 0 40px">출처: 국사편찬위원회 한국사능력검정시험 심화 제71~80회 문제·정답. 해설은 학습용으로 따로 작성한 요약이에요.</p>
  </div>`;
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  on('chg',()=>showLogin());
  on('resume',()=>startMock(resume.round,resume));
  on('drop',()=>{store.set('mock',null);home(null)});
  $app.querySelectorAll('.rbtn').forEach(b=>b.onclick=()=>startMock(+b.dataset.r));
  const eraBtns=document.getElementById('eras'),goEra=document.getElementById('goEra'),eraN=document.getElementById('eraN');
  const updEra=()=>{const n=Q.filter(x=>pick.eras.has(x.e)).length;goEra.disabled=!n;eraN.textContent=n?`${n}문항 중 ${pick.count&&pick.count<n?pick.count:n}문항`:''};
  eraBtns.onclick=e=>{const b=e.target.closest('[data-e]');if(!b)return;const i=+b.dataset.e;pick.eras.has(i)?pick.eras.delete(i):pick.eras.add(i);b.setAttribute('aria-pressed',pick.eras.has(i));updEra()};
  updEra();
  group('cnt','c',v=>{pick.count=+v;updEra()});
  group('sec','s',v=>pick.sec=+v);
  group('tr','t',v=>pick.trange=v);
  on('goEra',()=>{const pool=shuffle(Q.filter(x=>pick.eras.has(x.e)));const set=pick.count?pool.slice(0,pick.count):pool;
    set.sort((a,b)=>a.e-b.e||a.r-b.r||a.q-b.q);startPractice('era','시대별: '+[...pick.eras].sort().map(i=>ERAS[i]).join('·'),set,0)});
  on('goRnd',()=>startPractice('random','랜덤 10문제',shuffle(Q.slice()).slice(0,10),0));
  on('goTim',()=>{let pool=pick.trange==='era'&&pick.eras.size?Q.filter(x=>pick.eras.has(x.e)):Q.slice();
    startPractice('timer',`타이머 ${pick.sec}초`,shuffle(pool).slice(0,10),pick.sec)});
  on('goWr',()=>startPractice('wrong','오답노트',shuffle(Object.keys(wrongs()).map(k=>BY[k]).filter(Boolean)),0));
  on('clrWr',()=>dialog('오답노트를 모두 비울까요?','비우기',()=>{store.set('wrong',{});home(null)}));
  on('resend',async()=>{await flushOutbox();home(store.get('mock',null))});
}
function group(id,key,f){const g=document.getElementById(id);g.onclick=e=>{const b=e.target.closest('[data-'+key+']');if(!b)return;g.querySelectorAll('.tog').forEach(x=>x.setAttribute('aria-pressed',x===b));f(b.dataset[key])}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function stopTick(){if(tick){clearInterval(tick);tick=null}}

/* ---------- 문항 그리기 ---------- */
function qHTML(x){
  return `<div class="meta"><b>제${x.r}회 ${x.q}번</b><span>${x.s}점</span><span class="tag">${ERAS[x.e]}</span></div>
   ${x.p?`<div class="sheet"><img src="img/${x.p}" alt="제${x.r}회 ${x.q}번 공통 지문" data-z></div>`:''}
   <div class="sheet"><img src="img/${x.img}" width="${x.w}" height="${x.h}" alt="제${x.r}회 ${x.q}번 문제" data-z></div>`;
}
function preload(x){if(x){const i=new Image();i.src='img/'+x.img}}
function bindZoom(root){root.querySelectorAll('[data-z]').forEach(im=>im.onclick=()=>{
  let w=100;$layer.innerHTML=`<div class="zoom"><div class="zb"><button id="zi">＋</button><button id="zo">－</button><button id="zx">닫기</button></div><img src="${im.getAttribute('src')}" alt="" style="width:100%"></div>`;
  const z=$layer.querySelector('.zoom img');
  document.getElementById('zi').onclick=()=>{w=Math.min(w+50,250);z.style.width=w+'%'};
  document.getElementById('zo').onclick=()=>{w=Math.max(w-50,100);z.style.width=w+'%'};
  document.getElementById('zx').onclick=()=>$layer.innerHTML='';
})}
function exHTML(x){return x.x?`<div class="ex"><b>해설</b> ${esc(x.x)}</div>`:'<div class="ex" style="color:var(--mute)">해설 준비 중이에요.</div>'}

/* ---------- 연습 모드(시대별·랜덤·타이머·오답) ---------- */
function startPractice(mode,label,set,sec){
  if(!set.length)return;
  S={mode,label,set,i:0,sec,ans:{},t0:Date.now(),done:false};renderPractice();
}
function renderPractice(){
  stopTick();
  const x=S.set[S.i],a=S.ans[x.id];const answered=a!==undefined;
  $app.innerHTML=`<div class="bar"><div class="wrap"><button class="icon" id="quit">나가기</button><span class="t">${esc(S.label)}</span><span class="clock" id="clk">${S.i+1}/${S.set.length}</span></div>${S.sec?'<div class="tline"><i id="tl" style="width:100%"></i></div>':''}</div>
   <div class="wrap">${qHTML(x)}
    ${answered?`<div class="fb ${a===x.a?'':'bad'}"><h3>${a===x.a?'정답이에요!':(a===0?'시간 초과':'아쉬워요, 오답')}</h3>
      <p>정답 <b>${MARK[x.a-1]}</b>${a&&a!==x.a?` · 내 답 ${MARK[a-1]}`:''}</p>${exHTML(x)}</div>`:''}
   </div>
   <div class="omr"><div class="wrap"><div class="marks">${MARK.map((m,k)=>{const n=k+1;let c='';if(answered){if(n===x.a)c='right';else if(n===a)c='wrong'}return `<button class="mk ${c}" data-n="${n}" ${answered?'disabled':''} aria-label="${n}번">${m}</button>`}).join('')}</div>
    ${answered?`<div class="nav"><button class="go" id="next">${S.i+1<S.set.length?'다음 문제 →':'결과 보기'}</button></div>`:''}</div></div>`;
  bindZoom($app);preload(S.set[S.i+1]);window.scrollTo(0,0);
  document.getElementById('quit').onclick=()=>dialog('풀이를 그만두고 나갈까요? 지금까지 푼 문제는 기록돼요.','나가기',()=>finishPractice(true));
  $app.querySelectorAll('.mk').forEach(b=>b.onclick=()=>answerP(+b.dataset.n));
  const nx=document.getElementById('next');if(nx){nx.onclick=nextP;nx.focus({preventScroll:true})}
  if(S.sec&&!answered){
    const end=Date.now()+S.sec*1000,tl=document.getElementById('tl'),clk=document.getElementById('clk');
    const upd=()=>{const left=(end-Date.now())/1000;tl.style.width=Math.max(0,left/S.sec*100)+'%';tl.classList.toggle('warn',left<=10);
      clk.textContent=`${S.i+1}/${S.set.length} · ${Math.max(0,Math.ceil(left))}초`;clk.classList.toggle('warn',left<=10);if(left<=0)answerP(0)};
    upd();tick=setInterval(upd,250);
  }
}
function answerP(n){
  const x=S.set[S.i];if(S.ans[x.id]!==undefined)return;stopTick();
  S.ans[x.id]=n;record(x,n===x.a,S.mode==='wrong');renderPractice();
}
function nextP(){if(S.i+1<S.set.length){S.i++;renderPractice()}else finishPractice(false)}
function finishPractice(early){
  stopTick();
  const done=S.set.filter(x=>S.ans[x.id]!==undefined);
  if(!done.length){home(store.get('mock',null));return}
  const cor=done.filter(x=>S.ans[x.id]===x.a).length;
  const rec=mkRec({mode:S.mode,label:S.label+(early?' (중단)':''),correct:cor,total:done.length,
    wrong:done.filter(x=>S.ans[x.id]!==x.a).map(x=>x.id),sec:Math.round((Date.now()-S.t0)/1000)});
  showResult(rec,done,S.ans);
}
function record(x,ok,inWrongMode){
  const st=stats();const o=st[x.id]||{n:0,c:0};o.n++;if(ok)o.c++;o.last=ok?1:0;st[x.id]=o;store.set('stats',st);
  const w=wrongs();if(!ok)w[x.id]=(w[x.id]||0)+1;else if(inWrongMode||w[x.id])delete w[x.id];store.set('wrong',w);
}

/* ---------- 실전 모의고사 ---------- */
function startMock(round,resume){
  const set=Q.filter(x=>x.r===round).sort((a,b)=>a.q-b.q);
  S={mode:'mock',label:`제${round}회 모의고사`,round,set,i:resume?.i||0,ans:resume?.ans||{},left:resume?.left??CFG.examMinutes*60,t0:Date.now()};
  S.deadline=Date.now()+S.left*1000;saveMock();renderMock();
}
function saveMock(){if(S&&S.mode==='mock')store.set('mock',{round:S.round,i:S.i,ans:S.ans,left:Math.round((S.deadline-Date.now())/1000)})}
function renderMock(){
  stopTick();
  const x=S.set[S.i],a=S.ans[x.id],n=Object.keys(S.ans).length;
  $app.innerHTML=`<div class="bar"><div class="wrap"><button class="icon" id="quit">나가기</button><span class="t">제${S.round}회 · ${n}/50 마킹</span><span class="clock" id="clk"></span><button class="icon" id="sheet">답안지</button></div></div>
   <div class="wrap">${qHTML(x)}</div>
   <div class="omr"><div class="wrap"><div class="marks">${MARK.map((m,k)=>`<button class="mk ${a===k+1?'on':''}" data-n="${k+1}" aria-label="${k+1}번">${m}</button>`).join('')}</div>
    <div class="nav"><button class="go ghost" id="prev" ${S.i?'':'disabled'}>← 이전</button>${S.i<49?'<button class="go" id="next">다음 →</button>':'<button class="go red" id="sub">제출하기</button>'}</div></div></div>`;
  bindZoom($app);preload(S.set[S.i+1]);window.scrollTo(0,0);
  const clk=document.getElementById('clk');
  const upd=()=>{const left=(S.deadline-Date.now())/1000;clk.textContent=fmt(left);clk.classList.toggle('warn',left<300);if(left<=0){stopTick();submitMock(true)}};
  upd();tick=setInterval(()=>{upd();if(Date.now()%15000<1000)saveMock()},1000);
  $app.querySelectorAll('.mk').forEach(b=>b.onclick=()=>{const v=+b.dataset.n;if(S.ans[x.id]===v)delete S.ans[x.id];else S.ans[x.id]=v;saveMock();
    if(S.ans[x.id]&&S.i<49){S.i++;renderMock()}else renderMock()});
  document.getElementById('prev').onclick=()=>{S.i--;saveMock();renderMock()};
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.i++;saveMock();renderMock()};
  const sb=document.getElementById('sub');if(sb)sb.onclick=confirmSubmit;
  document.getElementById('sheet').onclick=omrPanel;
  document.getElementById('quit').onclick=()=>{saveMock();home(store.get('mock',null))};
}
function omrPanel(){
  const n=Object.keys(S.ans).length;
  $layer.innerHTML=`<div class="ov" id="ov"><div class="panel"><h3>답안지 · ${n}/50 마킹</h3>
   <div class="grid50">${S.set.map((x,k)=>`<button class="cell ${S.ans[x.id]?'filled':''} ${k===S.i?'cur':''}" data-k="${k}">${x.q}<em>${S.ans[x.id]?MARK[S.ans[x.id]-1]:'&nbsp;'}</em></button>`).join('')}</div>
   <div class="row"><button class="go red" id="sub2">제출하기</button><button class="go ghost" id="cls">계속 풀기</button></div></div></div>`;
  const close=()=>$layer.innerHTML='';
  document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')close()};
  document.getElementById('cls').onclick=close;
  document.getElementById('sub2').onclick=()=>{close();confirmSubmit()};
  $layer.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{S.i=+c.dataset.k;close();saveMock();renderMock()});
}
function confirmSubmit(){const left=50-Object.keys(S.ans).length;
  dialog(left?`아직 ${left}문항을 마킹하지 않았어요. 그래도 제출할까요?`:'답안을 제출할까요?','제출',()=>submitMock(false))}
function submitMock(auto){
  stopTick();store.set('mock',null);
  let score=0,cor=0;S.set.forEach(x=>{const ok=S.ans[x.id]===x.a;if(ok){score+=x.s;cor++}if(S.ans[x.id])record(x,ok,false)});
  const best=store.get('best',{});best[S.round]=Math.max(best[S.round]??0,score);store.set('best',best);
  const used=CFG.examMinutes*60-Math.max(0,Math.round((S.deadline-Date.now())/1000));
  const rec=mkRec({mode:'mock',label:`제${S.round}회 모의고사${auto?' (시간 종료)':''}`,round:S.round,score,correct:cor,total:50,
    grade:grade(score),wrong:S.set.filter(x=>S.ans[x.id]!==x.a).map(x=>x.id),sec:used});
  showResult(rec,S.set,S.ans);
}
const grade=s=>s>=80?'1급':s>=70?'2급':s>=60?'3급':'불합격';

/* ---------- 결과 · 다시보기 ---------- */
function mkRec(o){
  const r={rid:Date.now().toString(36)+Math.random().toString(36).slice(2,7),code:code(),at:new Date().toISOString(),...o};
  r.wrong=(o.wrong||[]).join(',');
  const h=store.get('hist',[]);h.unshift({label:r.label,mode:r.mode,score:r.score,correct:r.correct,total:r.total,at:r.at});store.set('hist',h.slice(0,50));
  if(CFG.scriptUrl){const ob=store.get('outbox',[]);ob.push(r);store.set('outbox',ob)}
  return r;
}
async function flushOutbox(){
  if(!CFG.scriptUrl)return;
  const ob=store.get('outbox',[]);if(!ob.length)return;
  const keep=[];
  for(const r of ob){try{const res=await fetch(CFG.scriptUrl,{method:'POST',body:JSON.stringify(r)});const j=await res.json();if(!j.ok)keep.push(r)}catch(e){keep.push(r)}}
  store.set('outbox',keep);
}
function resultCode(r){const b=new TextEncoder().encode(JSON.stringify(r));let s='';b.forEach(c=>s+=String.fromCharCode(c));return 'HK1-'+btoa(s)}
async function showResult(r,set,ans){
  stopTick();
  const byE=ERAS.map(()=>[0,0]);set.filter(x=>ans[x.id]!==undefined||r.mode==='mock').forEach(x=>{byE[x.e][1]++;if(ans[x.id]===x.a)byE[x.e][0]++});
  const wrongList=set.filter(x=>(ans[x.id]!==undefined||r.mode==='mock')&&ans[x.id]!==x.a);
  const pct=Math.round(r.correct/r.total*100);
  $app.innerHTML=`<section class="cover"><div class="wrap"><p style="margin:0">${esc(r.label)}</p>
    <div class="score" style="margin-top:8px">${r.mode==='mock'?`<b style="color:#fff">${r.score}점</b><span class="grade" style="color:${r.grade==='불합격'?'#ffb4a8':'#fff'}">${r.grade}</span>`:`<b style="color:#fff">${r.correct}/${r.total}</b><span class="grade" style="color:#fff">${pct}%</span>`}</div>
    <p>${r.mode==='mock'?`${r.correct}/50 정답 · `:''}걸린 시간 ${fmt(r.sec)} · ${pct>=80?'훌륭해요! 이 감각 그대로 가요.':pct>=60?'좋아요, 틀린 문제만 다시 보면 한 단계 올라가요.':'괜찮아요. 오답노트가 실력이 되는 곳이에요.'}</p></div></section>
   <div class="wrap"><section class="sec"><h2>시대별 정답률</h2><div style="margin-top:10px">
     ${byE.map((v,i)=>v[1]?`<div class="erow"><span>${ERAS[i]}</span><div class="ebar"><i style="width:${v[0]/v[1]*100}%"></i></div><span>${v[0]}/${v[1]}</span></div>`:'').join('')}</div></section>
   <section class="sec"><h2>틀린 문제 ${wrongList.length}개</h2><p class="sub">${wrongList.length?'눌러서 정답과 해설을 확인하세요. 오답노트에도 담겼어요.':'만점! 정말 잘했어요.'}</p>
     ${wrongList.length?`<div class="grid50">${wrongList.map((x,k)=>`<button class="cell x" data-k="${k}">${r.mode==='mock'?x.q:x.r+'-'+x.q}<em>${ans[x.id]?MARK[ans[x.id]-1]:'—'}</em></button>`).join('')}</div>`:''}
     ${r.mode==='mock'?`<div class="row"><button class="go ghost" id="all">전체 문항 다시 보기</button></div>`:''}</section>
   <section class="sec"><h2>선생님께 제출</h2><div id="sst" class="status">${CFG.scriptUrl?'제출 중…':'미리보기 모드라 자동 제출은 꺼져 있어요.'}</div>
     <details style="margin-top:12px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center">결과 코드로 제출하기 (자동 제출이 안 될 때)</summary>
      <p class="note">아래 코드를 복사해서 선생님이 알려 준 곳에 붙여 넣으세요.</p><textarea class="code" id="rc" readonly>${esc(resultCode(r))}</textarea>
      <div class="row"><button class="go ghost" id="cp">코드 복사</button></div></details></section>
   <div class="row" style="padding:18px 0 40px"><button class="go" id="hm">처음으로</button>${wrongList.length?'<button class="go ghost" id="rw">틀린 문제 다시 풀기</button>':''}</div></div>`;
  window.scrollTo(0,0);
  $app.querySelectorAll('.cell.x').forEach(c=>c.onclick=()=>review(wrongList,+c.dataset.k,ans,()=>showResult(r,set,ans)));
  const al=document.getElementById('all');if(al)al.onclick=()=>review(set,0,ans,()=>showResult(r,set,ans));
  document.getElementById('hm').onclick=()=>home(store.get('mock',null));
  const rw=document.getElementById('rw');if(rw)rw.onclick=()=>startPractice('wrong','방금 틀린 문제',shuffle(wrongList.slice()),0);
  document.getElementById('cp').onclick=async()=>{const t=document.getElementById('rc');try{await navigator.clipboard.writeText(t.value);document.getElementById('cp').textContent='복사됨 ✓'}catch(e){t.select()}};
  if(CFG.scriptUrl){await flushOutbox();const left=store.get('outbox',[]).some(o=>o.rid===r.rid);const s=document.getElementById('sst');
    if(s){s.textContent=left?'지금은 제출이 안 됐어요. 다음에 앱을 열면 자동으로 다시 보내요. 급하면 아래 결과 코드를 쓰세요.':'선생님께 제출했어요 ✓';s.classList.toggle('bad',left)}}
}
function review(list,k,ans,back){
  const x=list[k],a=ans[x.id];
  $app.innerHTML=`<div class="bar"><div class="wrap"><button class="icon" id="bk">← 결과</button><span class="t">다시 보기 ${k+1}/${list.length}</span></div></div>
   <div class="wrap">${qHTML(x)}<div class="fb ${a===x.a?'':'bad'}"><h3>${a===x.a?'정답':'오답'}</h3><p>정답 <b>${MARK[x.a-1]}</b> · 내 답 ${a?MARK[a-1]:'안 씀'}</p>${exHTML(x)}</div></div>
   <div class="omr"><div class="wrap"><div class="nav" style="margin:0"><button class="go ghost" id="pv" ${k?'':'disabled'}>← 이전</button><button class="go" id="nx" ${k+1<list.length?'':'disabled'}>다음 →</button></div></div></div>`;
  bindZoom($app);window.scrollTo(0,0);
  document.getElementById('bk').onclick=back;
  document.getElementById('pv').onclick=()=>review(list,k-1,ans,back);
  document.getElementById('nx').onclick=()=>review(list,k+1,ans,back);
}

/* ---------- 공용 대화상자 · 키보드 ---------- */
function dialog(msg,ok,f){
  $layer.innerHTML=`<div class="ov" id="ov"><div class="panel dlg"><p>${esc(msg)}</p><div class="row"><button class="go" id="dok">${esc(ok)}</button><button class="go ghost" id="dno">취소</button></div></div></div>`;
  document.getElementById('dno').onclick=()=>$layer.innerHTML='';
  document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')$layer.innerHTML=''};
  document.getElementById('dok').onclick=()=>{$layer.innerHTML='';f()};
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape'){$layer.innerHTML='';return}
  if($layer.innerHTML)return;
  if(/^[1-5]$/.test(e.key)){const b=$app.querySelector(`.mk[data-n="${e.key}"]:not(:disabled)`);if(b)b.click()}
  else if(e.key==='ArrowRight'||e.key==='Enter'){const b=document.getElementById('next')||document.getElementById('nx');if(b&&!b.disabled){e.preventDefault();b.click()}}
  else if(e.key==='ArrowLeft'){const b=document.getElementById('prev')||document.getElementById('pv');if(b&&!b.disabled)b.click()}
});
window.addEventListener('pagehide',()=>saveMock());
boot();
}
</script>
</body>
</html>
